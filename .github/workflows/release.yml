name: Release Multi-Platform App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            os-name: 'macOS'
          - platform: 'ubuntu-22.04'
            os-name: 'Linux'
          - platform: 'windows-latest'
            os-name: 'Windows'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf build-essential curl wget file libssl-dev libayatana-appindicator3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend & Tauri CLI Dependencies
        run: |
          npm install
          npm install -D @tauri-apps/cli

      - name: Setup Tauri Project & Copy Native Templates
        run: |
          # If src-tauri does not exist, initialize it in CI mode
          if [ ! -d "src-tauri" ]; then
            npx @tauri-apps/cli init --ci --app-name "VeloAnalytics" --window-title "VeloAnalytics" --frontend-dist "../dist" --dev-url "http://localhost:3000" --before-dev-command "npm run dev" --before-build-command "npm run build"
          fi
          mkdir -p src-tauri/capabilities
          mkdir -p src-tauri/src
          cp native-macos/src-tauri-templates/Cargo.toml src-tauri/Cargo.toml
          cp native-macos/src-tauri-templates/default.json src-tauri/capabilities/default.json
          cp native-macos/src-tauri-templates/lib.rs src-tauri/src/lib.rs
          cp native-macos/src-tauri-templates/main.rs src-tauri/src/main.rs
          cp native-macos/src-tauri-templates/tauri.conf.json src-tauri/tauri.conf.json
          # Copy pre-generated icons into src-tauri/icons
          if [ -d "native-macos/icons" ]; then
            mkdir -p src-tauri/icons
            cp -r native-macos/icons/* src-tauri/icons/
          fi

      - name: Build with Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npx @tauri-apps/cli
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('v0.1.0-manual-{0}', github.run_number) }}
          releaseName: ${{ github.ref_type == 'tag' && format('VeloAnalytics {0}', github.ref_name) || format('VeloAnalytics v0.1.0 (Build {0})', github.run_number) }}
          releaseBody: |
            ### 🚴 VeloAnalytics Multi-Platform Desktop Release
            
            Welcome to the official desktop release of VeloAnalytics for macOS, Windows, and Linux!
            
            ---
            
            #### 🍏 macOS (.dmg)
            Because VeloAnalytics is an open-source build without an Apple Developer ID signature, macOS Gatekeeper may display:  
            > *"VeloAnalytics.app is damaged and can't be opened."*
            
            **Quick 3-Second Fix:**
            1. Drag `VeloAnalytics.app` from the `.dmg` into your **`/Applications`** folder.
            2. Open **Terminal.app** and run:
               ```bash
               xattr -cr /Applications/VeloAnalytics.app
               ```
            3. Open VeloAnalytics normally.
            
            For a detailed walkthrough, see [docs/MACOS_INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/MACOS_INSTALL.md).
            
            ---
            
            #### 🪟 Windows (.msi / -setup.exe)
            Windows SmartScreen may display: *"Windows protected your PC"*.  
            **Quick Fix:** Click **More info**, then click **Run anyway**.
            
            ---
            
            #### 🐧 Linux (.AppImage / .deb)
            - **AppImage:** Make the file executable and run:
              ```bash
              chmod +x VeloAnalytics*.AppImage
              ./VeloAnalytics*.AppImage
              ```
            - **Debian / Ubuntu (.deb):**
              ```bash
              sudo dpkg -i velo-analytics*.deb
              ```
            
            For full installation instructions across all platforms, see [docs/DESKTOP_INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/DESKTOP_INSTALL.md).
          releaseDraft: false
          prerelease: false
